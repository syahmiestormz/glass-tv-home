plugins {
    id 'com.android.application'
}

android {
    namespace 'com.syahmie.stormztv.installer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.syahmie.stormztv.installer'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // The launcher APK is bundled in assets and opened with openFd(), which needs it stored uncompressed.
    androidResources {
        noCompress 'apk'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
