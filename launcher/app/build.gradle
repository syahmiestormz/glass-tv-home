plugins {
    id 'com.android.application'
}

android {
    namespace 'com.syahmie.stormztv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.syahmie.stormztv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // Release signing: CI passes a fixed keystore through environment variables (see .github/workflows),
    // so every build carries the same key and OTA updates install over each other. Without them
    // (a local build) it falls back to the debug key.
    signingConfigs {
        stormz {
            def ks = System.getenv('STORMZ_KEYSTORE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('STORMZ_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STORMZ_KEY_ALIAS') ?: 'stormz'
                keyPassword System.getenv('STORMZ_KEY_PASSWORD') ?: System.getenv('STORMZ_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('STORMZ_KEYSTORE') ? signingConfigs.stormz : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
