name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lists-and-tools:
    name: Lists, tools and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools virtualenv
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
      - name: Example lists, README tables, shell helpers
        env:
          CLEANYOURTV_STRICT: ${{ github.event_name == 'push' && '1' || '' }}
        run: python3 -m unittest discover -s tests -v

  launcher:
    name: Launcher build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and release build
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testReleaseUnitTest :app:assembleRelease
      - name: The launcher stays small
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          echo "release APK: $((size / 1024)) KB"
          test "$size" -lt 2097152 || { echo "APK is over 2 MB; the launcher targets 2 GB boxes, keep it small"; exit 1; }
      - name: Phone installer (bundles this launcher build)
        working-directory: launcher
        run: |
          mkdir -p installer/src/main/assets
          cp app/build/outputs/apk/release/app-release.apk installer/src/main/assets/stormz-tv.apk
          ./gradlew --no-daemon :installer:assembleRelease
      - name: Keep the APKs (download them from this run's Summary page)
        uses: actions/upload-artifact@v4
        with:
          name: stormz-tv-apks
          path: |
            launcher/app/build/outputs/apk/release/app-release.apk
            launcher/installer/build/outputs/apk/release/installer-release.apk
          retention-days: 30
